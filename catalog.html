<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qust — Каталог</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">

  <div class="grain"></div>
  <div class="cursor"      id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <nav class="nav nav--light">
    <a href="index.html" class="nav__logo">qust</a>
    <ul class="nav__links">
      <li><a href="catalog.html" class="active">Shop</a></li>
      <li><a href="new-drop.html">New Drop</a></li>
      <li><a href="archive.html">Archive</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <main class="page">

    <!-- ── HEADER ───────────────────────────────────────────── -->
    <div class="cat-header">
      <h1 class="cat-header__title">Ката<span>лог</span></h1>
      <div class="cat-header__row">
        <span class="cat-header__count label" id="catCount">SS 2025</span>
        <div class="filters" id="catFilters">
          <button class="filter-btn active" data-filter="all">Все</button>
          <button class="filter-btn" data-filter="gloves">Перчатки</button>
          <button class="filter-btn" data-filter="tops">Футболки</button>
          <button class="filter-btn" data-filter="sweatshirts">Свитшоты</button>
          <button class="filter-btn" data-filter="zip-hoodies">Зип-худи</button>
          <button class="filter-btn" data-filter="hoodies">Худи</button>
          <button class="filter-btn" data-filter="shirts">Рубашки</button>
        </div>
      </div>
    </div>

    <!-- ── PRICE SLIDER ─────────────────────────────────────── -->
    <div class="price-filter">
      <div class="price-filter__labels">
        <span class="label">Цена</span>
        <span class="price-filter__range">
          <span id="labelMin">999 ₽</span>
          <span class="price-filter__dash">—</span>
          <span id="labelMax">5 555 ₽</span>
        </span>
      </div>
      <div class="price-filter__slider">
        <div class="price-filter__track">
          <div class="price-filter__fill" id="sliderFill"></div>
        </div>
        <input type="range" id="rangeMin" min="999" max="5555" value="999" step="1">
        <input type="range" id="rangeMax" min="999" max="5555" value="5555" step="1">
      </div>
    </div>

    <div class="sp-lg"></div>

    <!-- ── GRID ─────────────────────────────────────────────── -->
    <section class="cat-wrap">
      <div class="cat-grid" id="catGrid"></div>
      <p class="cat-empty" id="catEmpty">Нет товаров в этом диапазоне</p>
    </section>

    <div class="sp-xl"></div>

  </main>

  <footer>
    <div class="footer__top">
      <div class="footer__wordmark">qust</div>
      <nav class="footer__nav">
        <div>
          <p class="footer__col-title">Навигация</p>
          <ul class="footer__col-links">
            <li><a href="catalog.html">Каталог</a></li>
            <li><a href="about.html">О бренде</a></li>
          </ul>
        </div>
        <div>
          <p class="footer__col-title">Контакт</p>
          <ul class="footer__col-links">
            <li><a href="mailto:qust@mail.ru">qust@mail.ru</a></li>
            <li><a href="#">Instagram</a></li>
            <li><a href="#">Telegram</a></li>
          </ul>
        </div>
      </nav>
    </div>
    <div class="footer__bottom">
      <span class="footer__copy">&copy; 2025 qust Studio</span>
      <span class="footer__city">Moscow, Russia</span>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      const grid     = document.getElementById('catGrid');
      const empty    = document.getElementById('catEmpty');
      const count    = document.getElementById('catCount');
      const labelMin = document.getElementById('labelMin');
      const labelMax = document.getElementById('labelMax');
      const fill     = document.getElementById('sliderFill');
      const rangeMin = document.getElementById('rangeMin');
      const rangeMax = document.getElementById('rangeMax');

      const MIN_PRICE = 999;
      const MAX_PRICE = 5555;

      let activeCat = 'all';
      let priceMin  = MIN_PRICE;
      let priceMax  = MAX_PRICE;

      function fmt(n) {
        return n.toLocaleString('ru') + ' ₽';
      }

      function plural(n, one, few, many) {
        const m10  = n % 10;
        const m100 = n % 100;
        if (m100 >= 11 && m100 <= 14) return many;
        if (m10 === 1) return one;
        if (m10 >= 2 && m10 <= 4) return few;
        return many;
      }

      function updateFill() {
        const lo = ((priceMin - MIN_PRICE) / (MAX_PRICE - MIN_PRICE)) * 100;
        const hi = ((priceMax - MIN_PRICE) / (MAX_PRICE - MIN_PRICE)) * 100;
        fill.style.left  = lo + '%';
        fill.style.width = (hi - lo) + '%';
      }

      function renderCards() {
        const visible = PRODUCTS.filter(p => {
          const catOk   = activeCat === 'all' || p.cat === activeCat;
          const priceOk = p.price >= priceMin && p.price <= priceMax;
          return catOk && priceOk;
        });

        grid.innerHTML = '';
        empty.style.display = visible.length ? 'none' : 'block';
        count.textContent   = 'SS 2025 — ' + visible.length + ' ' +
          plural(visible.length, 'вещь', 'вещи', 'вещей');

        visible.forEach((p, i) => {
          const thumb = p.images[0] || '';
          const card  = document.createElement('a');
          card.className       = 'card cat-card-anim';
          card.href            = 'product.html?id=' + p.id;
          card.dataset.cat     = p.cat;
          card.style.animationDelay = (i * 0.04) + 's';
          card.innerHTML = `
            <div class="card__media">
              ${thumb
                ? `<img src="${thumb}" alt="${p.name}" class="card__img" loading="lazy">`
                : '<div class="card__placeholder"></div>'
              }
              <div class="card__shimmer"></div>
              <div class="card__veil"></div>
            </div>
            <div class="card__info">
              <span class="card__name">${p.name}</span>
              <span class="card__price">${fmt(p.price)}</span>
            </div>
            <span class="card__tag">${p.type}</span>
          `;
          grid.appendChild(card);
        });
      }

      document.getElementById('catFilters').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = btn.dataset.filter;
        renderCards();
      });

      rangeMin.addEventListener('input', () => {
        priceMin = Math.min(parseInt(rangeMin.value), priceMax - 1);
        rangeMin.value = priceMin;
        labelMin.textContent = fmt(priceMin);
        updateFill();
        renderCards();
      });

      rangeMax.addEventListener('input', () => {
        priceMax = Math.max(parseInt(rangeMax.value), priceMin + 1);
        rangeMax.value = priceMax;
        labelMax.textContent = fmt(priceMax);
        updateFill();
        renderCards();
      });

      updateFill();
      renderCards();
    })();
  </script>
</body>
</html>
