<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qust — Каталог</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">

  <div class="grain"></div>
  <div class="cursor"      id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <nav class="nav nav--light">
    <a href="index.html" class="nav__logo">qust</a>
    <ul class="nav__links">
      <li><a href="catalog.html" class="active">Shop</a></li>
      <li><a href="new-drop.html">New Drop</a></li>
      <li><a href="archive.html">Archive</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <main class="page">

    <!-- ── HEADER ───────────────────────────────────────────── -->
    <div class="cat-header">
      <h1 class="cat-header__title">Ката<span>лог</span></h1>
      <span class="cat-header__count label" id="catCount">SS 2026</span>
    </div>

    <!-- ── GRID ─────────────────────────────────────────────── -->
    <section class="cat-wrap">
      <div class="cat-grid" id="catGrid"></div>
      <p class="cat-empty" id="catEmpty">Нет товаров по выбранным фильтрам</p>
    </section>

    <div class="sp-xl"></div>

  </main>

  <!-- ── BOTTOM FILTER BAR ─────────────────────────────────── -->
  <div class="filter-bar">
    <div class="filter-bar__cats" id="catOpts">
      <button class="fpill" id="newDropPill" data-newdrop="1">New Drop</button>
      <button class="fpill active" data-cat="all">Все</button>
      <button class="fpill" data-cat="gloves">Перчатки</button>
      <button class="fpill" data-cat="tops">Футболки</button>
      <button class="fpill" data-cat="sweatshirts">Свитшоты</button>
      <button class="fpill" data-cat="zip-hoodies">Зип-худи</button>
      <button class="fpill" data-cat="hoodies">Худи</button>
      <button class="fpill" data-cat="shirts">Рубашки</button>
    </div>
    <button class="filter-bar__btn" id="filterToggle" aria-label="Фильтры">
      <svg width="13" height="10" viewBox="0 0 13 10" fill="none" aria-hidden="true">
        <path d="M1 1.5h11M3.5 5h6M6 8.5h1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      Фильтр
      <span class="filter-bar__badge" id="filterBadge"></span>
    </button>
  </div>

  <!-- ── FILTER POPOVER ──────────────────────────────────────── -->
  <div class="filter-popover" id="filterPopover">

    <div class="filter-popover__row">
      <span class="filter-popover__label">Цвет</span>
      <div class="filter-row__opts" id="colorOpts">
        <button class="fcolor" data-color="черный"       title="Черный"       style="background:#1c1c1c"></button>
        <button class="fcolor" data-color="серый"        title="Серый"        style="background:#909090"></button>
        <button class="fcolor" data-color="белый"        title="Белый"        style="background:#f2f2f2; box-shadow:inset 0 0 0 1px #ccc"></button>
        <button class="fcolor" data-color="разноцветный" title="Разноцветный" style="background:conic-gradient(#e84393,#f6b73c,#4caf50,#2196f3,#9c27b0,#e84393)"></button>
      </div>
    </div>

    <div class="filter-popover__row">
      <span class="filter-popover__label">Цена</span>
      <div class="filter-row__opts filter-row__opts--price">
        <span class="fprice-val" id="labelMin">999 ₽</span>
        <div class="fprice-slider">
          <div class="fprice-track">
            <div class="fprice-fill" id="priceFill"></div>
          </div>
          <input type="range" id="rangeMin" min="999" max="5555" value="999"  step="1">
          <input type="range" id="rangeMax" min="999" max="5555" value="5555" step="1">
        </div>
        <span class="fprice-val" id="labelMax">5 555 ₽</span>
      </div>
    </div>

    <div class="filter-chips-row" id="chipsRow" style="display:none">
      <div class="filter-chips" id="filterChips"></div>
      <button class="filter-reset" id="filterReset">Сбросить всё</button>
    </div>

  </div>
  <div class="filter-popover__backdrop" id="filterBackdrop"></div>

  <footer>
    <div class="footer__top">
      <div class="footer__wordmark">qust</div>
      <nav class="footer__nav">
        <div>
          <p class="footer__col-title">Навигация</p>
          <ul class="footer__col-links">
            <li><a href="catalog.html">Каталог</a></li>
            <li><a href="about.html">О бренде</a></li>
          </ul>
        </div>
        <div>
          <p class="footer__col-title">Контакт</p>
          <ul class="footer__col-links">
            <li><a href="mailto:qustchil@gmail.com">qustchil@gmail.com</a></li>
            <li><a href="https://t.me/qusteverywhere" target="_blank">Telegram</a></li>
          </ul>
        </div>
      </nav>
    </div>
    <div class="footer__bottom">
      <span class="footer__copy">&copy; 2023-2026 qust Studio</span>
      <span class="footer__city">Perm, Russia</span>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
  (function () {
    const MIN = 999, MAX = 5555;

    const state = {
      cat:      'all',
      colors:   new Set(),
      priceMin: MIN,
      priceMax: MAX,
      newDropOnly: false,
    };

    const catLabels = {
      gloves: 'Перчатки', tops: 'Футболки', sweatshirts: 'Свитшоты',
      'zip-hoodies': 'Зип-худи', hoodies: 'Худи', shirts: 'Рубашки'
    };

    const $grid      = document.getElementById('catGrid');
    const $empty     = document.getElementById('catEmpty');
    const $count     = document.getElementById('catCount');
    const $chips     = document.getElementById('filterChips');
    const $chipsRow  = document.getElementById('chipsRow');
    const $reset     = document.getElementById('filterReset');
    const $fill      = document.getElementById('priceFill');
    const $rMin      = document.getElementById('rangeMin');
    const $rMax      = document.getElementById('rangeMax');
    const $lMin      = document.getElementById('labelMin');
    const $lMax      = document.getElementById('labelMax');
    const $toggle   = document.getElementById('filterToggle');
    const $popover  = document.getElementById('filterPopover');
    const $backdrop = document.getElementById('filterBackdrop');
    const $badge    = document.getElementById('filterBadge');

    function fmt(n) { return n.toLocaleString('ru') + ' ₽'; }
    function plural(n) {
      const m = n % 10, h = n % 100;
      if (h >= 11 && h <= 14) return 'вещей';
      if (m === 1) return 'вещь';
      if (m >= 2 && m <= 4) return 'вещи';
      return 'вещей';
    }

    const legacyColors = {
      'черный': 'С‡РµСЂРЅС‹Р№',
      'серый': 'СЃРµСЂС‹Р№',
      'белый': 'Р±РµР»С‹Р№',
      'разноцветный': 'СЂР°Р·РЅРѕС†РІРµС‚РЅС‹Р№'
    };

    function matches(p) {
      return p.images.length > 0
          && (!state.newDropOnly || p.newDrop)
          && (state.cat === 'all' || p.cat === state.cat)
          && (state.colors.size === 0 || state.colors.has(p.color) || state.colors.has(legacyColors[p.color]))
          && p.price >= state.priceMin && p.price <= state.priceMax;
    }

    // ── FILL ────────────────────────────────────────────────────
    function updateFill() {
      const lo = ((state.priceMin - MIN) / (MAX - MIN)) * 100;
      const hi = ((state.priceMax - MIN) / (MAX - MIN)) * 100;
      $fill.style.left  = lo + '%';
      $fill.style.width = (hi - lo) + '%';
      $lMin.textContent = fmt(state.priceMin);
      $lMax.textContent = fmt(state.priceMax);
      $rMin.value = state.priceMin;
      $rMax.value = state.priceMax;
    }

    // ── CARDS ────────────────────────────────────────────────────
    function renderCards() {
      const visible = PRODUCTS.filter(matches);
      $grid.innerHTML = '';
      $empty.style.display = visible.length ? 'none' : 'block';
      $count.textContent   = 'SS 2026 — ' + visible.length + ' ' + plural(visible.length);

      visible.forEach((p, i) => {
        const a = document.createElement('a');
        a.className = 'card cat-card-anim';
        a.href      = 'product.html?id=' + p.id;
        a.style.animationDelay = (i * 0.04) + 's';
        a.innerHTML = `
          <div class="card__media">
            ${p.images[0]
              ? `<img src="${p.images[0]}" alt="${p.name}" class="card__img" loading="lazy">`
              : '<div class="card__placeholder"></div>'
            }
            <div class="card__shimmer"></div>
            <div class="card__veil"></div>
          </div>
          <div class="card__info">
            <span class="card__name">${p.name}</span>
            <span class="card__price">${fmt(p.price)}</span>
          </div>
          <span class="card__tag">${p.type}</span>
        `;
        $grid.appendChild(a);
      });
    }

    // ── CHIPS ────────────────────────────────────────────────────
    function renderChips() {
      $chips.innerHTML = '';

      if (state.newDropOnly) {
        addChip('New Drop', () => {
          state.newDropOnly = false;
          document.getElementById('newDropPill').classList.remove('active');
          renderAll();
        });
      }

      if (state.cat !== 'all') {
        addChip(catLabels[state.cat] || state.cat, () => {
          state.cat = 'all';
          document.querySelectorAll('.fpill[data-cat]').forEach(b =>
            b.classList.toggle('active', b.dataset.cat === 'all'));
          renderAll();
        });
      }

      state.colors.forEach(c => {
        addChip(c, () => {
          state.colors.delete(c);
          document.querySelectorAll('.fcolor').forEach(b =>
            b.classList.toggle('active', state.colors.has(b.dataset.color)));
          renderAll();
        });
      });

      const priceChanged = state.priceMin > MIN || state.priceMax < MAX;
      if (priceChanged) {
        addChip(fmt(state.priceMin) + ' — ' + fmt(state.priceMax), () => {
          state.priceMin = MIN;
          state.priceMax = MAX;
          updateFill();
          renderAll();
        });
      }

      const hasChips = $chips.children.length > 0;
      $chipsRow.style.display = hasChips ? 'flex' : 'none';

      // badge
      let n = 0;
      if (state.newDropOnly) n++;
      if (state.cat !== 'all') n++;
      n += state.colors.size;
      if (state.priceMin > MIN || state.priceMax < MAX) n++;
      $badge.textContent = n;
      $badge.classList.toggle('visible', n > 0);
    }

    function addChip(label, onRemove) {
      const chip = document.createElement('span');
      chip.className = 'filter-chip';
      chip.innerHTML = label + '<span class="filter-chip__x">×</span>';
      chip.querySelector('.filter-chip__x').addEventListener('click', onRemove);
      $chips.appendChild(chip);
    }

    function renderAll() {
      renderCards();
      renderChips();
    }

    // ── EVENTS ───────────────────────────────────────────────────
    document.getElementById('catOpts').addEventListener('click', e => {
      const btn = e.target.closest('.fpill');
      if (!btn) return;

      if (btn.dataset.newdrop) {
        state.newDropOnly = !state.newDropOnly;
        btn.classList.toggle('active', state.newDropOnly);
        renderAll();
        return;
      }

      document.querySelectorAll('.fpill[data-cat]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.cat = btn.dataset.cat;
      renderAll();
    });

    document.getElementById('colorOpts').addEventListener('click', e => {
      const btn = e.target.closest('.fcolor');
      if (!btn) return;
      const c = btn.dataset.color;
      if (state.colors.has(c)) state.colors.delete(c);
      else state.colors.add(c);
      btn.classList.toggle('active', state.colors.has(c));
      renderAll();
    });

    $rMin.addEventListener('input', () => {
      state.priceMin = Math.min(parseInt($rMin.value), state.priceMax - 1);
      updateFill();
      renderAll();
    });

    $rMax.addEventListener('input', () => {
      state.priceMax = Math.max(parseInt($rMax.value), state.priceMin + 1);
      updateFill();
      renderAll();
    });

    $reset.addEventListener('click', () => {
      state.cat      = 'all';
      state.colors   = new Set();
      state.priceMin = MIN;
      state.priceMax = MAX;
      state.newDropOnly = false;
      document.querySelectorAll('.fpill[data-cat]').forEach(b =>
        b.classList.toggle('active', b.dataset.cat === 'all'));
      document.getElementById('newDropPill').classList.remove('active');
      document.querySelectorAll('.fcolor').forEach(b => b.classList.remove('active'));
      updateFill();
      renderAll();
    });

    // ── POPOVER TOGGLE ───────────────────────────────────────────
    function closePopover() {
      $popover.classList.remove('open');
      $backdrop.classList.remove('open');
      $toggle.classList.remove('active');
    }

    $toggle.addEventListener('click', () => {
      const open = $popover.classList.toggle('open');
      $backdrop.classList.toggle('open', open);
      $toggle.classList.toggle('active', open);
    });

    $backdrop.addEventListener('click', closePopover);

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePopover();
    });

    // ── INIT ─────────────────────────────────────────────────────
    updateFill();
    renderAll();
  })();
  </script>
</body>
</html>
