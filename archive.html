  <script src="js/main.js"></script>
  <script>
    (function () {
      const lb        = document.getElementById('lightbox');
      const lbImg     = document.getElementById('lbImg');
      const lbNum     = document.getElementById('lbNum');
      const lbClose   = document.getElementById('lbClose');
      const lbBackdrop = document.getElementById('lbBackdrop');

      document.querySelectorAll('.arch-photo').forEach(fig => {
        fig.addEventListener('click', () => {
          lbImg.src = fig.querySelector('img').src;
          lbNum.textContent = fig.dataset.n;
          lb.classList.add('open');
          lbBackdrop.classList.add('open');
          document.body.style.overflow = 'hidden';
        });
      });

      function closeLb() {
        lb.classList.remove('open');
        lbBackdrop.classList.remove('open');
        document.body.style.overflow = '';
      }

      lbClose.addEventListener('click', closeLb);
      lbBackdrop.addEventListener('click', closeLb);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
    })();
  </script>
